<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DC運用ガイド 読本</title>
  <meta name="description" content="JDCC データセンター運用ガイドブック(第2版)を毎日少しずつ読み進めるための学習アプリ">
  <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151619" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DC運用読本">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    Webフォントはレンダリングをブロックさせない。
    オフライン時やネットワークが不調なときは、CSS側で指定した
    システムの明朝/ゴシックにそのままフォールバックして即座に読める。
  -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600&display=swap">
  </noscript>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 初回描画前にテーマと本文幅を確定(ちらつき防止)
    (function () {
      var pref = localStorage.getItem('theme');
      var dark = pref ? pref === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';

      var s = document.documentElement.style;

      var W = {
        narrow: ['980px', '2200px'],
        wide:   ['1320px', '2400px'],
        full:   ['1800px', '100%'],
      };
      var w = W[localStorage.getItem('reading-width')] || W.full;
      s.setProperty('--reading-width', w[0]);
      s.setProperty('--layout-max', w[1]);

      var F = { small: '15px', medium: '16.5px', large: '18.5px' };
      s.setProperty('--prose-size', F[localStorage.getItem('font-size')] || F.medium);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="topbar" id="topbar">
    <button class="icon-btn nav-toggle" id="btn-drawer" aria-label="章一覧を開く">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="5" y="4" width="22" height="24" rx="2.5"/>
        <path d="M11 11h10M11 16h10M11 21h6"/>
      </svg>
      <span class="brand-text"><strong>DC運用ガイド</strong><small>読本</small></span>
    </a>
    <div class="topbar-quota" id="topbar-quota" hidden>
      <div class="quota-track"><div class="quota-fill" id="quota-fill"></div></div>
      <span class="quota-label" id="quota-label"></span>
    </div>
    <nav class="topbar-nav" aria-label="ページ">
      <a href="#/" data-nav="home" class="icon-btn" aria-label="章一覧" title="章一覧">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-7-4-7 4z"/></svg>
      </a>
      <a href="#/cdfom" data-nav="cdfom" class="icon-btn" aria-label="CDFOM研修" title="CDFOM研修">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M6 10.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5"/></svg>
      </a>
      <a href="#/glossary" data-nav="glossary" class="icon-btn" aria-label="用語集" title="用語集">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </a>
      <a href="#/highlights" data-nav="highlights" class="icon-btn" aria-label="マーカー一覧" title="マーカー一覧">
        <svg viewBox="0 0 24 24"><path d="M9 15l-4 5h6l1-2M9 15L18 4l3 3-9 11M9 15l3 3"/></svg>
      </a>
      <a href="#/notes" data-nav="notes" class="icon-btn" aria-label="メモ一覧" title="メモ一覧">
        <svg viewBox="0 0 24 24"><path d="M5 4h14v13l-4 3H5z"/><path d="M15 20v-3h4"/></svg>
      </a>
    </nav>
    <div class="topbar-tools">
      <button class="icon-btn panel-toggle" id="btn-panel" aria-label="目次と進捗" title="目次と進捗">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h13"/></svg>
      </button>
      <button class="icon-btn" id="btn-focus" aria-label="集中モード" title="集中モード">
        <svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      </button>
      <button class="icon-btn" id="btn-notepad" aria-label="メモパッド" title="メモパッド">
        <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/><path d="M9.5 12h6M9.5 16h4"/></svg>
      </button>
      <button class="icon-btn" id="btn-tts" aria-label="読み上げ" title="読み上げ">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/><path d="M18.8 6.5a7.6 7.6 0 0 1 0 11"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" aria-label="表示テーマ切り替え" title="テーマ">
        <svg viewBox="0 0 24 24" class="theme-icon-light"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <svg viewBox="0 0 24 24" class="theme-icon-dark"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="学習設定" title="学習設定">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="章一覧">
      <div class="sidebar-inner" id="sidebar-inner"></div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <main class="main" id="main" tabindex="-1"></main>
    <aside class="rightpanel" id="rightpanel" aria-label="補助情報">
      <div class="rightpanel-inner" id="rightpanel-inner"></div>
    </aside>
  </div>

  <aside class="notepad" id="notepad" aria-label="メモパッド" hidden>
   <div class="notepad-inner">
    <div class="notepad-head">
      <svg class="notepad-icon" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>
      <span class="notepad-title">メモパッド</span>
      <span class="notepad-status" id="notepad-status"></span>
      <button class="icon-btn" id="notepad-close" aria-label="メモパッドを閉じる">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <textarea id="notepad-body" placeholder="読みながら気づいたこと、あとで調べたいこと、用語の対応関係——
自由に書き留めておけます。入力は自動で保存されます。"></textarea>
    <div class="notepad-foot">
      <span id="notepad-count">0 字</span>
      <button class="btn btn-sm btn-ghost" id="notepad-clear">消去</button>
    </div>
   </div>
  </aside>

  <div class="popover" id="popover" role="dialog" hidden></div>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="selection-tool" id="selection-tool" hidden>
    <button id="btn-mark">
      <svg viewBox="0 0 24 24"><path d="M9 15l-4 5h6l1-2M9 15L18 4l3 3-9 11M9 15l3 3"/></svg>
      マーカー
    </button>
  </div>
  <div class="tts-bar" id="tts-bar" hidden>
    <button class="tts-btn" id="tts-prev" aria-label="前の段落">
      <svg viewBox="0 0 24 24"><path d="M17 5L9 12l8 7z"/><path d="M7 5v14"/></svg>
    </button>
    <button class="tts-btn tts-main" id="tts-toggle" aria-label="読み上げ">
      <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
      <svg class="ico-stop" viewBox="0 0 24 24"><rect x="7" y="6" width="4" height="12" rx="1"/><rect x="13" y="6" width="4" height="12" rx="1"/></svg>
    </button>
    <button class="tts-btn" id="tts-next" aria-label="次の段落">
      <svg viewBox="0 0 24 24"><path d="M7 5l8 7-8 7z"/><path d="M17 5v14"/></svg>
    </button>
    <div class="tts-meta">
      <span class="tts-label" id="tts-label">読み上げ</span>
      <span class="tts-pos">
        <span id="tts-pos"></span>
        <span class="tts-awake" id="tts-awake" hidden title="再生中は画面を消さないようにしています">画面ON保持</span>
      </span>
    </div>
    <label class="tts-rate">
      <span id="tts-rate-val">1.45×</span>
      <input type="range" id="tts-rate" min="0.6" max="2" step="0.05" value="1.45" aria-label="読み上げ速度">
    </label>
    <label class="tts-auto" title="読み終えたら次の章・モジュールへ続けて読む">
      <input type="checkbox" id="tts-auto" checked>
      連続
    </label>
    <select class="tts-voice" id="tts-voice" aria-label="声を選ぶ"></select>
    <button class="tts-btn tts-close" id="tts-close" aria-label="読み上げを終了">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
