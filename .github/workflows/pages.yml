name: Deploy to GitHub Pages

# 開発ブランチへのプッシュを gh-pages ブランチへミラーして公開する。
# (GITHUB_TOKEN では Pages サイトの新規作成ができないため、
#  ブランチ方式の Pages を利用する)

on:
  push:
    branches: [claude/build-prompt-implementation-yiav4d]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror to gh-pages
        run: git push --force origin HEAD:gh-pages
